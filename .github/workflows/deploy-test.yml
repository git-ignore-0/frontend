name: Deploy FEv1 test

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality gate
        run: |
          node scripts/lint-ci.mjs
          npm run typecheck
          npm test
          bash tests/prepare-cpanel-deploy.test.sh
          bash tests/deploy-test-ftps.test.sh
          python3 tests/test_deploy_worker.py
      - name: Build Passenger bundle from commit
        env:
          DEPLOY_SITE_ORIGIN: https://test.naturalfarmingvietnam.com
          AUTH_ORIGIN: https://auth-test.naturalfarmingvietnam.com
          CONTENT_API_ORIGIN: https://auth-test.naturalfarmingvietnam.com
        run: npm run prepare:cpanel
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp
      - name: Upload and restart FEv1 test
        env:
          TEST_FTP_SERVER: ${{ secrets.TEST_FTP_SERVER }}
          TEST_FTP_USERNAME: ${{ secrets.TEST_FTP_USERNAME }}
          TEST_FTP_PASSWORD: ${{ secrets.TEST_FTP_PASSWORD }}
        run: bash scripts/deploy-test-ftps.sh
      - name: Smoke test FEv1 test
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            --retry-all-errors --max-time 30 \
            https://test.naturalfarmingvietnam.com/vi \
            --output "$RUNNER_TEMP/frontend-test.html"
          grep -q '/_next/static/' "$RUNNER_TEMP/frontend-test.html"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            --retry-all-errors --max-time 30 \
            'https://test.naturalfarmingvietnam.com/api/site-settings?locale=vi' \
            --output "$RUNNER_TEMP/frontend-settings.json"
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const settings = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/frontend-settings.json`, 'utf8'));
          assert(settings && typeof settings === 'object', 'FEv1 could not load backend settings');
          assert.equal(typeof settings.is_email_enabled, 'boolean');
          assert.equal(typeof settings.is_phone_enabled, 'boolean');
          assert(Array.isArray(settings.links), 'Invalid settings response');
          JS
